[project]
name = "itwadura-inventory"
version = "1.0.0"
description = "A simple, dependable open-source inventory management system for small businesses."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Itwadura Inventory Contributors" }
]
dependencies = [
    "Django>=5.1.0,<6.2.0",
    "python-dotenv>=1.0.1",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests", "apps"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "staticfiles",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # function calls in argument defaults (standard Django pattern)
]

