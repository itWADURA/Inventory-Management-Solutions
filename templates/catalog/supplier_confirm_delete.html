{% extends "base.html" %}

{% block title %}Delete Supplier - Itwadura Inventory{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
  <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <div class="flex items-center space-x-3 text-rose-600 mb-4">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      <h1 class="text-xl font-bold text-gray-900">Delete Supplier</h1>
    </div>

    <p class="text-sm text-gray-600 mb-6">
      Are you sure you want to delete supplier <strong>{{ supplier.name }}</strong>? Associated items will have their supplier reference cleared.
    </p>

    <form method="post" class="flex items-center justify-between">
      {% csrf_token %}
      <a href="{% url 'catalog:supplier_list' %}" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold rounded-lg shadow-sm">
        Confirm Delete
      </button>
    </form>
  </div>
</div>
{% endblock %}
